name: Release Multi-Platform Installer & Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run JS test suite
        run: npm test

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust test suite
        run: cargo test --manifest-path installer/Cargo.toml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ag-effort-slider-windows-x86_64.exe
            is_windows: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ag-effort-slider-macos-aarch64
            is_windows: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ag-effort-slider-macos-x86_64
            is_windows: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ag-effort-slider-linux-x86_64
            is_windows: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --manifest-path installer/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare upload directory
        shell: bash
        run: |
          mkdir -p upload
          if [ "${{ matrix.is_windows }}" = "true" ]; then
            cp "installer/target/${{ matrix.target }}/release/ag-effort-slider.exe" "upload/${{ matrix.artifact_name }}"
          else
            cp "installer/target/${{ matrix.target }}/release/ag-effort-slider" "upload/${{ matrix.artifact_name }}"
            chmod +x "upload/${{ matrix.artifact_name }}"
          fi

      - name: Package slim Windows ZIP
        if: matrix.is_windows == true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path zip_stage/lib -Force | Out-Null
          Copy-Item "upload/${{ matrix.artifact_name }}" "zip_stage/ag-effort-slider.exe"
          Copy-Item "lib/client.js" "zip_stage/lib/client.js"
          Copy-Item "install.cmd" "zip_stage/install.cmd"
          Copy-Item "uninstall.cmd" "zip_stage/uninstall.cmd"
          Copy-Item "install-asar.ps1" "zip_stage/install-asar.ps1"
          Copy-Item "LICENSE" "zip_stage/LICENSE"
          Compress-Archive -Path "zip_stage/*" -DestinationPath "upload/antigravity-effort-slider-windows-x64.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: upload/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Copy client.js and online install scripts
        run: |
          cp lib/client.js release-assets/client.js
          cp scripts/install.ps1 release-assets/install.ps1
          cp scripts/install.sh release-assets/install.sh

      - name: Generate manifest.json and sha256sums.txt
        run: |
          TAG_VER="${GITHUB_REF_NAME}"
          if [[ "$TAG_VER" != v* ]]; then
            TAG_VER="v$(node -p "require('./package.json').version")"
          fi
          node scripts/generate-manifest.mjs --dir release-assets --version "$TAG_VER" --repo "${{ github.repository }}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
